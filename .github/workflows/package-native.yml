name: Package Native Apps

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Absolute backend URL, e.g. https://your-api.onrender.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    env:
      APP_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run desktop:build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: mob-taskmanager-windows
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi

  macos:
    name: macOS universal Intel + Apple Silicon
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    env:
      APP_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: npm install
      - run: npm run desktop:build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mob-taskmanager-macos-universal
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  android:
    name: Android test APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      APP_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Configure Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - run: npm install
      - run: npx tauri android init --ci
      - run: npm run icons
      - run: npx tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: mob-taskmanager-android-test-apk
          if-no-files-found: error
          path: frontend/src-tauri/gen/android/app/build/outputs/**/*.apk

  ios-simulator:
    name: iOS simulator app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    env:
      APP_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Ensure CocoaPods
        run: command -v pod >/dev/null 2>&1 || brew install cocoapods
      - run: npm install
      - run: npx tauri ios init --ci
      - run: npm run icons
      - name: Select simulator architecture
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            echo "IOS_SIM_TARGET=aarch64-sim" >> "$GITHUB_ENV"
          else
            echo "IOS_SIM_TARGET=x86_64" >> "$GITHUB_ENV"
          fi
      - run: npx tauri ios build --debug --target "$IOS_SIM_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: mob-taskmanager-ios-simulator
          if-no-files-found: error
          path: frontend/src-tauri/gen/apple/build/**/*.app
