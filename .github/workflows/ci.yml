name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-placeholder-value
      DATABASE_URL: sqlite:///./ci.db
      ALLOW_SQLITE_FOR_TESTS: "true"
      CORS_ORIGINS: http://localhost:4200,tauri://localhost,http://tauri.localhost
      GOOGLE_CLIENT_ID: ci-google-client.example
      APPLE_CLIENT_ID: ci.apple.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: python --version
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -c "from app.main import app; assert app.title == 'Task Manager API'"
      - run: PYTHONPATH=. python tests/smoke.py
      - run: PYTHONPATH=. python tests/productivity_smoke.py
      - run: PYTHONPATH=. python tests/auth_verification_oauth_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive

  native-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      APP_API_BASE_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm install
      - run: npm run build:native
      - run: npm run icons
      - run: cargo check --manifest-path src-tauri/Cargo.toml
