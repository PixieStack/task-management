<nav class="dashboard-navbar" aria-label="Authenticated navigation">
  <a class="navbar-brand" routerLink="/dashboard" aria-label="M.O.B TaskManager dashboard">
    <span class="brand-mark">M</span>
    <div>
      <strong>M.O.B</strong>
      <small>TaskManager</small>
    </div>
  </a>

  <div class="workspace-links" aria-label="Workspace navigation">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/todo" routerLinkActive="active">Todo</a>
  </div>

  <div class="user-profile">
    <div class="welcome-message">
      <span class="greeting-emoji">{{ greetingEmoji }}</span>
      <span><small>{{ greeting }}</small>{{ username }}</span>
    </div>

    <div class="profile-dropdown-container">
      <button
        type="button"
        class="profile-picture"
        (click)="toggleProfileDropdown($event)"
        [attr.aria-expanded]="isProfileDropdownOpen"
        aria-label="Open account menu"
      >
        <img
          *ngIf="profilePicture"
          [src]="profilePicture"
          alt="Profile picture"
        />
        <span *ngIf="!profilePicture" class="profile-initials">
          {{ username?.charAt(0) || "U" }}
        </span>
      </button>

      <div class="profile-dropdown" *ngIf="isProfileDropdownOpen">
        <div class="dropdown-header">
          <div class="user-info">
            <span class="account-kicker">Signed in</span>
            <h3>{{ username }}</h3>
            <p *ngIf="email">{{ email }}</p>
          </div>
          <button class="change-photo-btn" (click)="addProfilePicture($event)">
            <i class="fas fa-camera"></i> Change photo
          </button>
        </div>

        <div class="dropdown-menu">
          <ul>
            <li>
              <a routerLink="/dashboard" routerLinkActive="active" (click)="closeProfileDropdown()">
                <i class="fas fa-table-cells-large"></i> Dashboard
              </a>
            </li>
            <li>
              <a routerLink="/todo" routerLinkActive="active" (click)="closeProfileDropdown()">
                <i class="fas fa-square-check"></i> Todo
              </a>
            </li>
            <li>
              <a routerLink="/profile" routerLinkActive="active" (click)="closeProfileDropdown()">
                <i class="fas fa-user-circle"></i> Account settings
              </a>
            </li>
            <li class="dropdown-divider"></li>
            <li>
              <a (click)="logout()" class="logout-item">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
